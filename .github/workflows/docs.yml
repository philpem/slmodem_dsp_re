name: Maintainer guide

on:
  pull_request:
    paths:
      - 'docs/maintainer/**'
      - 'mkdocs.yml'
      - 'tools/ci/docs-requirements.txt'
      - '.github/workflows/docs.yml'
  push:
    branches: [master]
    paths:
      - 'docs/maintainer/**'
      - 'mkdocs.yml'
      - 'tools/ci/docs-requirements.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/docs-requirements.txt
      - name: Install documentation tools
        run: python -m pip install -r tools/ci/docs-requirements.txt
      - name: Build guide and check internal links
        run: python -m mkdocs build --strict
      - uses: actions/upload-artifact@v4
        with:
          name: maintainer-guide
          path: build/docs-site
