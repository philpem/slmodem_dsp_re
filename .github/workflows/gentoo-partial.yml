name: Gentoo Partial Link

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  partial-metrics:
    name: Gentoo partial-link metrics
    runs-on: ubuntu-latest
    env:
      GENTOO_IMAGE: ghcr.io/philpem/gcc-3.4.2-gentoo2005-docker:latest
      # partiallink.sh and period.mk both read TC_IMAGE; point it at the image
      # this job pulls rather than the local development tag.
      TC_IMAGE: ghcr.io/philpem/gcc-3.4.2-gentoo2005-docker:latest
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # byteident's link-selected view reads ELF symbol tables through
      # pyelftools; the partial-metric tools themselves did not need it.
      - name: Set up host analysis Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: tools/ci/requirements.txt

      - name: Install host analysis dependencies
        run: python3 -m pip install -r tools/ci/requirements.txt

      - name: Self-test partial metric logic
        run: |
          python3 tools/ci/partial_metrics.py --self-test
          python3 tools/ci/link_selected_check.py --self-test

      - name: Pull recovered Gentoo compiler
        run: docker pull --platform linux/386 "$GENTOO_IMAGE"

      - name: Record recovered compiler identity
        id: gentoo-image-id
        run: |
          echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$GENTOO_IMAGE")" >> "$GITHUB_OUTPUT"

      - name: Check out PR base
        run: git worktree add --detach "$RUNNER_TEMP/dsplibs-base" "$BASE_SHA"

      - name: Restore PR base partial census
        id: base-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gentoo-partial-base
          key: gentoo-partial-base-v4-${{ env.BASE_SHA }}-${{ steps.gentoo-image-id.outputs.digest }}-${{ hashFiles('Makefile', 'tools/tuattrib.py', 'tools/tumap.py', 'tools/elfinfo.py', 'docs/attribution.json', 'tools/toolchain/partialcmp.py', 'tools/toolchain/partiallink.sh', 'tools/toolchain/recoverorder.py', 'tools/ci/partial_metrics.py', 'tools/bindcmp.py') }}

      - name: Build PR base partial link and census
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/dsplibs-base
        run: |
          mkdir -p "$RUNNER_TEMP/gentoo-partial-base"
          make partial-link J=4
          python3 tools/toolchain/partialcmp.py ref/slmodemd/dsplibs.o \
            build/partial/dsplibs.o \
            --json "$RUNNER_TEMP/gentoo-partial-base/base.json"
          # The MEASURING tool comes from the head checkout, not the base:
          # `--count` is this PR's addition and the base commit predates it.
          python3 "$GITHUB_WORKSPACE/tools/bindcmp.py" \
            "$RUNNER_TEMP/dsplibs-base/ref/slmodemd/dsplibs.o" \
            "$RUNNER_TEMP/dsplibs-base/build/partial/dsplibs.o" --count \
            > "$RUNNER_TEMP/gentoo-partial-base/base.bindings"

      - name: Build PR head partial link and census
        run: |
          make partial-link J=4
          python3 tools/toolchain/partialcmp.py ref/slmodemd/dsplibs.o \
            build/partial/dsplibs.o --json "$RUNNER_TEMP/head-partial.json"
          python3 tools/bindcmp.py ref/slmodemd/dsplibs.o \
            build/partial/dsplibs.o --count \
            > "$RUNNER_TEMP/head-partial.bindings"

      - name: Report link-selected COMDAT bodies
        run: |
          # REUSE build/tc_repro RATHER THAN PAYING FOR `make tc`.  Measured on
          # master: the census over build/tc_repro is identical to the census
          # over build/tc_out except for the "ours :" path line, while
          # build/tc_repro is already built by `make partial-link` above and
          # feeds the link-selected report.  The report reads the manifest and
          # partial object beside it, so TC_OUT selects the same object tree.
          #
          # THE EXPECTATION IS PINNED IN tools/ci/link_selected_check.py.  A new
          # multiply-defined name, a changed record/resolved count or a changed
          # selected body is a deliberate COMDAT/selection ledger update, not
          # drift to be accepted because the job is green.  `--summary` adds the
          # three-phase block to stdout, and the checker cross-checks phase 2
          # against phase 0 (link-selected EXACT >= per-TU EXACT, the excess
          # equal to the selected-EXACT-only disagreements, grade 0-or-1 >=
          # EXACT, and the end-target line present).  This step is REPORT-ONLY:
          # it does not alter the metrics or ratchet steps below.
          set -o pipefail
          TC_OUT=build/tc_repro python3 tools/toolchain/byteident.py \
            --link-selected --summary \
            2> "$RUNNER_TEMP/link-selected-report.txt" \
            | tee "$RUNNER_TEMP/link-selected-census.txt" > /dev/null || {
              cat "$RUNNER_TEMP/link-selected-report.txt"
              exit 1
            }
          cat "$RUNNER_TEMP/link-selected-report.txt"
          sed -n '/phase summary/,$p' "$RUNNER_TEMP/link-selected-census.txt"
          python3 tools/ci/link_selected_check.py \
            "$RUNNER_TEMP/link-selected-report.txt" \
            --summary "$RUNNER_TEMP/link-selected-census.txt"

      - name: Check explicit byte-identity proof inputs
        run: |
          python3 tools/toolchain/byteident_cli_controls.py \
            --work-dir "$RUNNER_TEMP/byteident-cli-controls" \
            --tc-out build/tc_repro \
            --link-manifest build/tc_repro/tc_link_manifest.txt \
            --linked build/partial/dsplibs.o

      # THE PHASED FLOOR MUST BE ENFORCED HERE, where the fresh tc_repro tree
      # and the recovered-order link already exist.  On a master push BASE_SHA
      # is github.sha, so the base/head comparison in gentoo-period.yml is the
      # head against itself and cannot catch a historical loss; this stored
      # floor is what catches one there.  The ratchet reads build/tc_out (the
      # NON-reproduce-bugs tree the floor was recorded on), which is why `make
      # tc` runs after the partial-link build, and the default manifest/linked
      # artifact paths sit beside TC_OUT so the phase-2 metric is available.
      - name: Enforce phased byte-identity floor
        run: |
          python3 tools/toolchain/byteident.py --ratchet-self-test
          make tc J=4
          TC_OUT=build/tc_out python3 tools/toolchain/byteident.py \
            --ratchet --summary

      - name: Compare and ratchet partial-link metrics
        id: metrics
        run: |
          set +e
          python3 tools/ci/partial_metrics.py \
            --base "$RUNNER_TEMP/gentoo-partial-base/base.json" \
            --head "$RUNNER_TEMP/head-partial.json" \
            --base-bindings "$(cat "$RUNNER_TEMP/gentoo-partial-base/base.bindings")" \
            --head-bindings "$(cat "$RUNNER_TEMP/head-partial.bindings")" \
            --check > "$RUNNER_TEMP/partial-metrics.md"
          status=$?
          cat "$RUNNER_TEMP/partial-metrics.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'markdown<<EOF'
            cat "$RUNNER_TEMP/partial-metrics.md"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Update PR metric summary
        if: ${{ always() && steps.metrics.outputs.markdown != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        env:
          METRICS: ${{ steps.metrics.outputs.markdown }}
        with:
          script: |
            const marker = '<!-- gentoo-partial-metrics -->';
            const body = process.env.METRICS;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prior = comments.find((comment) => comment.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
