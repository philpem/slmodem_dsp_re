name: Gentoo Partial Link

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  partial-metrics:
    name: Gentoo partial-link metrics
    runs-on: ubuntu-latest
    env:
      GENTOO_IMAGE: ghcr.io/philpem/gcc-3.4.2-gentoo2005-docker:latest
      # partiallink.sh and period.mk both read TC_IMAGE; point it at the image
      # this job pulls rather than the local development tag.
      TC_IMAGE: ghcr.io/philpem/gcc-3.4.2-gentoo2005-docker:latest
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Self-test partial metric logic
        run: python3 tools/ci/partial_metrics.py --self-test

      - name: Pull recovered Gentoo compiler
        run: docker pull --platform linux/386 "$GENTOO_IMAGE"

      - name: Record recovered compiler identity
        id: gentoo-image-id
        run: |
          echo "digest=$(docker image inspect --format '{{index .RepoDigests 0}}' "$GENTOO_IMAGE")" >> "$GITHUB_OUTPUT"

      - name: Check out PR base
        run: git worktree add --detach "$RUNNER_TEMP/dsplibs-base" "$BASE_SHA"

      - name: Restore PR base partial census
        id: base-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/gentoo-partial-base
          key: gentoo-partial-base-v2-${{ env.BASE_SHA }}-${{ steps.gentoo-image-id.outputs.digest }}-${{ hashFiles('tools/toolchain/partialcmp.py', 'tools/toolchain/partiallink.sh', 'tools/toolchain/recoverorder.py', 'tools/ci/partial_metrics.py', 'tools/bindcmp.py') }}

      - name: Build PR base partial link and census
        if: steps.base-cache.outputs.cache-hit != 'true'
        working-directory: ${{ runner.temp }}/dsplibs-base
        run: |
          mkdir -p "$RUNNER_TEMP/gentoo-partial-base"
          make partial-link J=4
          python3 tools/toolchain/partialcmp.py ref/slmodemd/dsplibs.o \
            build/partial/dsplibs.o \
            --json "$RUNNER_TEMP/gentoo-partial-base/base.json"
          python3 tools/bindcmp.py ref/slmodemd/dsplibs.o \
            build/partial/dsplibs.o --count \
            > "$RUNNER_TEMP/gentoo-partial-base/base.bindings"

      - name: Build PR head partial link and census
        run: |
          make partial-link J=4
          python3 tools/toolchain/partialcmp.py ref/slmodemd/dsplibs.o \
            build/partial/dsplibs.o --json "$RUNNER_TEMP/head-partial.json"
          python3 tools/bindcmp.py ref/slmodemd/dsplibs.o \
            build/partial/dsplibs.o --count \
            > "$RUNNER_TEMP/head-partial.bindings"

      - name: Compare and ratchet partial-link metrics
        id: metrics
        run: |
          set +e
          python3 tools/ci/partial_metrics.py \
            --base "$RUNNER_TEMP/gentoo-partial-base/base.json" \
            --head "$RUNNER_TEMP/head-partial.json" \
            --base-bindings "$(cat "$RUNNER_TEMP/gentoo-partial-base/base.bindings")" \
            --head-bindings "$(cat "$RUNNER_TEMP/head-partial.bindings")" \
            --check > "$RUNNER_TEMP/partial-metrics.md"
          status=$?
          cat "$RUNNER_TEMP/partial-metrics.md" >> "$GITHUB_STEP_SUMMARY"
          {
            echo 'markdown<<EOF'
            cat "$RUNNER_TEMP/partial-metrics.md"
            echo EOF
          } >> "$GITHUB_OUTPUT"
          exit "$status"

      - name: Update PR metric summary
        if: ${{ always() && steps.metrics.outputs.markdown != '' && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
        uses: actions/github-script@v7
        env:
          METRICS: ${{ steps.metrics.outputs.markdown }}
        with:
          script: |
            const marker = '<!-- gentoo-partial-metrics -->';
            const body = process.env.METRICS;
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const prior = comments.find((comment) => comment.body.includes(marker));
            if (prior) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: prior.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
