# testbench/modems.conf -- generated by `modems.sh pin`
#
# role      device (by-id, carries the adapter's serial number)      expected identity
#
# The third field is checked against what the modem reports to ATI3.
# A mismatch FAILS pre-flight, because it means the modem behind this
# adapter has been swapped and the run would be mislabelled.
supra      /dev/serial/by-id/usb-FTDI_FT232R_USB_UART_BG00D17G-if00-port0 SupraExpress
courier    /dev/serial/by-id/usb-Prolific_Technology_Inc._USB-Serial_Controller_CGEGb135B02-if00-port0 Courier
